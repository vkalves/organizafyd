name: AWS Provision and Migrate
on:
  push:
    branches: [main]
    paths:
      - 'infra/aws/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'src/integrations/aws/**'
      - '.github/workflows/aws-provision-and-migrate.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo (deploy-backend atualiza Lambda + EventBridge + migrations RDS; execute migra do Supabase; dry-run apenas verifica)'
        required: true
        default: 'deploy-backend'
        type: choice
        options:
          - deploy-backend
          - execute
          - dry-run
permissions:
  contents: read
jobs:
  provision-and-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      SOURCE_SUPABASE_DB_URL: ${{ secrets.OLD_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AWS and PostgreSQL dependencies
        run: python -m pip install 'psycopg[binary]==3.2.12' 'boto3>=1.35.0'
      - name: Bundle and Deploy AWS Lambda + EventBridge + RDS Migrations
        if: ${{ github.event_name == 'push' || inputs.mode == 'deploy-backend' }}
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save pg @aws-sdk/client-s3 @aws-sdk/s3-request-presigner @aws-sdk/s3-presigned-post
          mkdir -p dist-lambda
          node -e '
            const esbuild = require("esbuild");
            const stripNpmPlugin = {
              name: "strip-npm",
              setup(build) {
                build.onResolve({ filter: /^npm:/ }, async (args) => {
                  const pkg = args.path.replace(/^npm:/, "").replace(/@[0-9][^/]*$/, "");
                  if (pkg.startsWith("@aws-sdk/")) return { path: pkg, external: true };
                  return await build.resolve(pkg, { resolveDir: args.resolveDir, kind: args.kind });
                });
              },
            };
            esbuild.build({
              entryPoints: ["infra/aws/lambda/handler.ts"],
              bundle: true,
              platform: "node",
              target: "node20",
              format: "cjs",
              outfile: "dist-lambda/index.js",
              external: ["pg-native", "@aws-sdk/client-s3", "@aws-sdk/s3-request-presigner", "@aws-sdk/s3-presigned-post"],
              plugins: [stripNpmPlugin],
            }).catch((err) => { console.error(err); process.exit(1); });
          '
          python - <<'PY'
          import json, os, pathlib, time, zipfile, boto3, psycopg
          from botocore.config import Config

          region = os.environ.get("AWS_REGION", "us-east-2")
          session = boto3.Session(region_name=region)
          sm = session.client("secretsmanager")
          secret = json.loads(sm.get_secret_value(SecretId="avanca/backend/config")["SecretString"])
          db_url = secret.get("DATABASE_URL")
          if not db_url:
              raise RuntimeError("DATABASE_URL not found in Secrets Manager avanca/backend/config")

          migrations = sorted(pathlib.Path("supabase/migrations").glob("2026112[45]*.sql"))
          with psycopg.connect(db_url, connect_timeout=15, sslmode="require") as conn:
              with conn.cursor() as cur:
                  for mig in migrations:
                      print(f"Applying RDS migration: {mig.name}")
                      cur.execute(mig.read_text(encoding="utf-8"))
                  cur.execute("""
                      DO $$
                      BEGIN
                        IF NOT EXISTS (SELECT 1 FROM vault.secrets WHERE name = 'ig_worker_secret') THEN
                          PERFORM vault.create_secret(
                            replace(gen_random_uuid()::text, '-', '') || replace(gen_random_uuid()::text, '-', ''),
                            'ig_worker_secret'
                          );
                        END IF;
                      END $$;
                  """)
                  cur.execute("""
                      SELECT j.status, COALESCE(j.error_code, 'none'),
                             j.flow_id IS NOT NULL AS is_flow,
                             COALESCE(f.state, 'manual') AS flow_state,
                             (j.scheduled_at <= now()) AS is_due,
                             j.media_id IS NOT NULL AS has_media,
                             COUNT(*)
                        FROM public.ig_publication_jobs j
                        LEFT JOIN public.ig_flows f ON f.id = j.flow_id
                       GROUP BY 1, 2, 3, 4, 5, 6
                       ORDER BY 1
                  """)
                  print("Queue state BEFORE deploy:", cur.fetchall())
                  cur.execute("""
                      UPDATE public.ig_publication_jobs
                         SET status = 'scheduled',
                             lock_token = NULL,
                             locked_at = NULL,
                             next_attempt_at = now()
                       WHERE status = 'processing'
                         AND locked_at < now() - interval '10 minutes'
                         AND NOT publish_started
                  """)
                  print("Recovered expired processing leases:", cur.rowcount)
                  cur.execute("""
                      UPDATE public.ig_flows f
                         SET state = 'active'
                       WHERE f.state = 'completed'
                         AND EXISTS (
                           SELECT 1
                             FROM public.ig_publication_jobs j
                            WHERE j.flow_id = f.id
                              AND j.status IN ('scheduled', 'processing')
                         )
                  """)
                  print("Reactivated flows with pending scheduled jobs:", cur.rowcount)
              conn.commit()

          s3 = session.client("s3")
          buckets = [b["Name"] for b in s3.list_buckets().get("Buckets", []) if "avanca" in b["Name"]]
          print("Avanca S3 buckets in account:", buckets)
          cors_config = {
              "CORSRules": [
                  {
                      "AllowedOrigins": ["*"],
                      "AllowedMethods": ["GET", "HEAD"],
                      "AllowedHeaders": ["*"],
                      "ExposeHeaders": [
                          "Accept-Ranges",
                          "Content-Length",
                          "Content-Range",
                          "Content-Type",
                          "ETag",
                      ],
                      "MaxAgeSeconds": 3600,
                  },
                  {
                      "AllowedOrigins": [
                          "https://xn--avana-1ra.online",
                          "https://www.xn--avana-1ra.online",
                          "https://organizafy.site",
                          "https://www.organizafy.site",
                          "https://organizafyd.vercel.app",
                          "http://localhost:5173",
                          "http://localhost:8080",
                      ],
                      "AllowedMethods": ["POST"],
                      "AllowedHeaders": ["*"],
                      "ExposeHeaders": ["ETag", "x-amz-request-id"],
                      "MaxAgeSeconds": 3600,
                  },
              ]
          }
          for bname in buckets:
              s3.put_bucket_cors(Bucket=bname, CORSConfiguration=cors_config)
              print(f"Applied GET/HEAD/POST CORS rules on S3 bucket: {bname}")
              objs = s3.list_objects_v2(Bucket=bname, Prefix="instagram-publisher/", MaxKeys=5).get("Contents", [])
              print(f"Bucket {bname} instagram-publisher object sample count:", len(objs))

          zip_path = pathlib.Path("dist-lambda/lambda.zip")
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write("dist-lambda/index.js", "index.js")

          lam = session.client("lambda", config=Config(read_timeout=180, connect_timeout=15))
          funcs = lam.list_functions()["Functions"]
          targets = [f for f in funcs if "avanca" in f["FunctionName"].lower()]
          if not targets:
              raise RuntimeError("No Avanca Lambda function found in region " + region)

          def wait_lambda_ready(fn_name: str):
              for _ in range(40):
                  conf = lam.get_function_configuration(FunctionName=fn_name)
                  state = conf.get("State", "Active")
                  update = conf.get("LastUpdateStatus", "Successful")
                  if state == "Active" and update == "Successful":
                      return conf
                  if update == "Failed":
                      raise RuntimeError(f"Lambda update failed: {conf.get('LastUpdateStatusReason')}")
                  time.sleep(2)
              raise RuntimeError(f"Timed out waiting for Lambda {fn_name}")

          payload = zip_path.read_bytes()
          events = session.client("events")

          for fn in targets:
              fn_name = fn["FunctionName"]
              fn_arn = fn["FunctionArn"]
              conf = wait_lambda_ready(fn_name)
              env_vars = conf.get("Environment", {}).get("Variables", {})
              print(f"Lambda {fn_name} AWS_S3_BUCKET env:", env_vars.get("AWS_S3_BUCKET"))

              if conf.get("Timeout", 0) < 120 or conf.get("MemorySize", 0) < 1024:
                  print(f"Updating Lambda {fn_name} Timeout=120s MemorySize=1024MB...")
                  lam.update_function_configuration(
                      FunctionName=fn_name,
                      Timeout=120,
                      MemorySize=1024,
                  )
                  wait_lambda_ready(fn_name)

              res = lam.update_function_code(FunctionName=fn_name, ZipFile=payload, Publish=True)
              print(f"Updated Lambda {fn_name}: CodeSize={res.get('CodeSize')} Version={res.get('Version')}")
              wait_lambda_ready(fn_name)

              # Ensure 1-minute EventBridge scheduled worker rule is active and permitted
              rule_name = "avanca-worker-schedule"
              rule_res = events.put_rule(
                  Name=rule_name,
                  ScheduleExpression="rate(1 minute)",
                  State="ENABLED",
                  Description="Triggers Avanca Instagram publisher and monitor workers every minute",
              )
              rule_arn = rule_res["RuleArn"]
              try:
                  lam.add_permission(
                      FunctionName=fn_name,
                      StatementId="avanca-eventbridge-1min",
                      Action="lambda:InvokeFunction",
                      Principal="events.amazonaws.com",
                      SourceArn=rule_arn,
                  )
                  print(f"Added EventBridge invoke permission on {fn_name}")
              except lam.exceptions.ResourceConflictException:
                  print(f"EventBridge invoke permission already exists on {fn_name}")

              events.put_targets(
                  Rule=rule_name,
                  Targets=[{"Id": "avanca-lambda-worker", "Arn": fn_arn}],
              )
              print(f"Verified EventBridge rule {rule_name} (ENABLED, rate(1 minute)) -> {fn_name}")

              # Trigger one immediate scheduled worker tick to drain due publications and verify
              invoke_res = lam.invoke(
                  FunctionName=fn_name,
                  InvocationType="RequestResponse",
                  Payload=json.dumps({"source": "aws.events", "detail-type": "Scheduled Event"}).encode("utf-8"),
              )
              raw_out = invoke_res["Payload"].read().decode("utf-8", errors="replace")
              print(f"Immediate worker tick Status={invoke_res.get('StatusCode')} FunctionError={invoke_res.get('FunctionError')}: {raw_out}")

          with psycopg.connect(db_url, connect_timeout=15, sslmode="require") as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT status, COALESCE(error_code, 'none'), flow_id IS NOT NULL AS is_flow,
                             container_id IS NOT NULL AS has_container, media_id IS NOT NULL AS has_media, COUNT(*)
                        FROM public.ig_publication_jobs
                       GROUP BY 1, 2, 3, 4, 5
                       ORDER BY 1
                  """)
                  print("Queue state AFTER worker tick:", cur.fetchall())
                  cur.execute("""
                      SELECT
                        (SELECT COUNT(*) FROM public.ig_publisher_connections) AS total_connections,
                        (SELECT COUNT(*) FROM public.ig_account_health) AS total_health_rows,
                        (SELECT COUNT(*) FROM public.ig_account_health WHERE checked_at >= now() - interval '2 minutes') AS checked_last_2m,
                        (SELECT COUNT(*) FROM public.ig_account_alerts WHERE resolved_at IS NULL) AS active_alerts
                  """)
                  print("Live Alert Monitor coverage:", cur.fetchone())
                  cur.execute("""
                      SELECT state, COALESCE(error_code, 'none'), COUNT(*)
                        FROM public.ig_account_health
                       GROUP BY 1, 2
                       ORDER BY 1, 2
                  """)
                  print("Live Account Health states:", cur.fetchall())
                  cur.execute("""
                      SELECT c.graph_id, c.provider, public.ig_vault_read(c.secret_id)
                        FROM public.ig_publisher_connections c
                       WHERE NOT c.reconnect_required
                       LIMIT 2
                  """)
                  sample_conns = cur.fetchall()
              try:
                  import urllib.parse, urllib.request, urllib.error
                  for idx, (gid, provider, tok) in enumerate(sample_conns):
                      if not tok:
                          continue
                      host = "graph.instagram.com" if provider == "instagram" else "graph.facebook.com"
                      def probe(subpath, params):
                          q = urllib.parse.urlencode(params)
                          req = urllib.request.Request(
                              f"https://{host}/v24.0/{gid}{subpath}?{q}",
                              headers={"Authorization": f"Bearer {tok}"},
                          )
                          try:
                              with urllib.request.urlopen(req, timeout=15) as r:
                                  return r.status, json.loads(r.read().decode("utf-8"))
                          except urllib.error.HTTPError as e:
                              body = json.loads(e.read().decode("utf-8", errors="replace") or "{}")
                              err = body.get("error", {})
                              return e.code, {"error_code": err.get("code"), "subcode": err.get("error_subcode")}
                      st_prof, d_prof = probe("", {"fields": "id,username,followers_count,follows_count,media_count"})
                      st_med, d_med = probe("/media", {
                          "limit": "10",
                          "fields": "id,media_type,media_product_type,timestamp,like_count,comments_count,insights.metric(views,likes,reach,shares,saved,total_interactions)",
                      })
                      until_ts = int(time.time())
                      since_ts = until_ts - 28 * 86400
                      st_tot, d_tot = probe("/insights", {
                          "period": "day",
                          "since": str(since_ts),
                          "until": str(until_ts),
                          "metric": "views,accounts_engaged,total_interactions,likes,comments,shares,saves",
                          "metric_type": "total_value",
                      })
                      st_reach, d_reach = probe("/insights", {"metric": "reach", "period": "days_28"})
                      items = d_med.get("data", []) if isinstance(d_med, dict) else []
                      sample_types = [(m.get("media_type"), m.get("media_product_type"), bool(m.get("insights")), m.get("like_count") is not None) for m in items[:5]]
                      print(
                          f"Live Meta v24.0 Metrics Probe [acct#{idx+1} provider={provider}]: "
                          f"profile={st_prof}(followers={d_prof.get('followers_count') if isinstance(d_prof, dict) else None},media_count={d_prof.get('media_count') if isinstance(d_prof, dict) else None}) "
                          f"media_expand={st_med}(items={len(items)},types={sample_types},err={d_med.get('error_code') if isinstance(d_med, dict) else None}) "
                          f"totals_28d={st_tot}(err={d_tot.get('error_code') if isinstance(d_tot, dict) else None}) "
                          f"reach_28d={st_reach}(err={d_reach.get('error_code') if isinstance(d_reach, dict) else None})"
                      )
              except Exception as probe_err:
                  print("Live Meta probe skipped:", type(probe_err).__name__)
          PY
      - name: Provision AWS Stack (Cognito, RDS PostgreSQL, S3, API Gateway, Secrets Manager)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'deploy-backend' }}
        shell: bash
        run: python scripts/provision-aws-stack.py --region us-east-2
      - name: Migrate Supabase Schema, Data, Vault Secrets, and Cognito Users to AWS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'deploy-backend' }}
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "execute" ]; then
            python scripts/migrate-supabase-to-aws.py --execute --apply-schema --sync-cognito
          else
            python scripts/migrate-supabase-to-aws.py
          fi
