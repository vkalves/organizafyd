name: Supabase admin migration preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OLD_SUPABASE_DB_URL: ${{ secrets.OLD_SUPABASE_DB_URL }}
      NEW_SUPABASE_DB_URL: ${{ secrets.NEW_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Read-only connectivity and ownership check
        shell: bash
        run: python scripts/supabase-admin-preflight.py
