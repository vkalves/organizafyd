name: Windows companion
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/windows-companion.yml']
  push:
    branches: [main, feat/windows-companion]
    paths: ['desktop/**', '.github/workflows/windows-companion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Companion tests (includes real Windows DPAPI on Windows)
        working-directory: desktop
        run: python -m unittest discover -s tests -v
      - name: Verify installer scripts and runtime contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./desktop/tests/installer-check.ps1
      - name: Package Windows source and checksum
        if: runner.os == 'Windows'
        run: python desktop/package.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ZyonCompanion-Windows-1.1
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual isolated toolchain and companion requirements
        shell: powershell
        run: ./desktop/install-requirements.ps1
      - name: Verify rerun and dependency checks
        shell: powershell
        run: |
          ./desktop/install-requirements.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./desktop/launch.ps1 -Mode Prepare
      - name: Start Appium and companion using the installed dependencies
        shell: powershell
        run: ./desktop/tests/installer-smoke.ps1
