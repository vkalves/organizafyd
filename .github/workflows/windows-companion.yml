name: Windows companion
on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/windows-companion.yml']
  push:
    branches: [main, feat/windows-companion]
    paths: ['desktop/**', '.github/workflows/windows-companion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Enable installed Chrome fixture checks on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: '"ZYON_TEST_CHROME=C:\Program Files\Google\Chrome\Application\chrome.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Companion tests (includes real Windows DPAPI on Windows)
        working-directory: desktop
        run: python -m unittest discover -s tests -v
      - name: Verify installer scripts and runtime contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./desktop/tests/installer-check.ps1
      - name: Package Windows source and checksum
        if: runner.os == 'Windows'
        run: python desktop/package.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Zyon-Desktop-Source-2.0.4
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  installer:
    needs: desktop-executable
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Zyon-Desktop-Windows-2.0.4
          path: ${{ runner.temp }}/Zyon Desktop & runtime check
      - name: Install actual isolated toolchain from packaged application
        shell: powershell
        run: '& (Join-Path $env:RUNNER_TEMP ''Zyon Desktop & runtime check\install-requirements.ps1'')'
      - name: Verify rerun and dependency checks
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Zyon Desktop & runtime check'
          & (Join-Path $folder 'install-requirements.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $folder 'launch.ps1') -Mode Prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path $folder '.venv')) { throw 'Packaged install should not create a separate Python environment.' }
      - name: Start real Appium through the packaged desktop runtime
        shell: powershell
        run: ./desktop/tests/installer-smoke.ps1 -AppDirectory (Join-Path $env:RUNNER_TEMP 'Zyon Desktop & runtime check')

  desktop-executable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native executable build dependencies
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Build real Windows GUI executable
        working-directory: desktop
        run: python -m PyInstaller --noconfirm Zyon.spec
      - name: Check bundled dependencies and actual GUI window
        shell: powershell
        run: |
          $app = Join-Path $PWD 'desktop/dist/Zyon/Zyon.exe'
          $check = Start-Process -FilePath $app -ArgumentList '--self-test' -PassThru -Wait
          if ($check.ExitCode -ne 0) { throw 'Executable dependency check failed.' }
          $screenshot = Join-Path $PWD 'desktop/dist/native-window.png'
          $gui = Start-Process -FilePath $app -ArgumentList ('--smoke-test --capture-to "' + $screenshot + '"') -PassThru -Wait
          if ($gui.ExitCode -ne 0) { throw 'Native executable GUI smoke failed.' }
      - name: Package standalone native application
        run: python desktop/package-desktop.py
      - name: Verify packaged launcher uses the bundled executable
        shell: powershell
        run: |
          $launcher = Join-Path $PWD 'desktop/dist/Zyon/launch.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -Mode Prepare
          if ($LASTEXITCODE -ne 0) { throw 'Packaged launcher check failed.' }
          if (Test-Path 'desktop/dist/Zyon/.venv') { throw 'Packaged app should not create a separate Python environment.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Zyon-Desktop-Windows-2.0.4
          path: desktop/dist/Zyon/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Zyon-Desktop-Preview-2.0.4
          path: desktop/dist/native-window.png
          if-no-files-found: error
          retention-days: 30
